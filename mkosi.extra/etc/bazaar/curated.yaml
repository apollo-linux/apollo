rows:
  - banner:
      height: 250
      image:
        light-uri: file:///run/host/etc/bazaar/images/apollo-light.png
        dark-uri: file:///run/host/etc/bazaar/images/apollo-dark.png 
        fit: cover
        can-shrink: true
        alt: "The Apollo wallpaper: a rocket flying in the sky"
  - section:
      title:
        en: "Welcome to Apollo!"
      subtitle:
        string: |
          We've picked out some apps to help get you started
      appids:
        list:
          - io.github.alainm23.planify
          - org.mozilla.thunderbird
          - org.libreoffice.LibreOffice
          - org.gnome.gitlab.somas.Apostrophe
          - be.alexandervanhee.gradia
          - org.gnome.World.PikaBackup
          - io.github.nozwock.Packet
          - io.gitlab.adhami3310.Impression
          - page.tesk.Refine
          - com.mattjakeman.ExtensionManager
          - io.github.flattool.Warehouse
          - io.github.flattool.Ignition
          - com.github.tchx84.Flatseal
      enable-bulk-install: true
